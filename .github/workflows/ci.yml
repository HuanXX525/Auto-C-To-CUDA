name: CI

on:
  push:
    branches:
      - optimize
      - optimize\_branch
  workflow_dispatch:
    

jobs:
  build:
    runs-on: self-hosted
    container:
      image: hulintian/c2cuda-dev:v3.0

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build
          run: make all -j$(nproc)
